<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <rect x="0" y="0" width="1200" height="700" fill="#ffffff"/>
  <!-- Interior plan schematic -->
  <g transform="translate(120,140)">
    <rect x="0" y="0" width="900" height="420" fill="#f9fafb" stroke="#d1d5db"/>
    <!-- Rooms -->
    <rect x="20" y="20" width="240" height="180" fill="#e5e7eb" stroke="#9ca3af"/>
    <text x="40" y="110" font-family="Inter" font-size="16" fill="#374151">Bedroom</text>
    <rect x="280" y="20" width="300" height="180" fill="#e5e7eb" stroke="#9ca3af"/>
    <text x="300" y="110" font-family="Inter" font-size="16" fill="#374151">Living / Dining</text>
    <rect x="600" y="20" width="280" height="120" fill="#e5e7eb" stroke="#9ca3af"/>
    <text x="620" y="90" font-family="Inter" font-size="16" fill="#374151">Kitchenette</text>
    <rect x="600" y="150" width="140" height="50" fill="#e5e7eb" stroke="#9ca3af"/>
    <text x="610" y="180" font-family="Inter" font-size="14" fill="#374151">Bathroom</text>
    <!-- Terrace under hanger -->
    <rect x="20" y="220" width="860" height="160" fill="#eef2f7" stroke="#cbd5e1"/>
    <text x="40" y="300" font-family="Inter" font-size="16" fill="#374151">Optional Terrace / Mezzanine under Hanger Roof</text>
  </g>
  <!-- Human scale silhouette -->
  <g transform="translate(1050,500)">
    <circle cx="0" cy="-30" r="10" fill="#6b7280"/>
    <rect x="-8" y="-20" width="16" height="50" fill="#6b7280" rx="6"/>
  </g>
  <text x="40" y="60" font-family="Cinzel, Georgia, serif" font-size="28" fill="#111827">Interior Layout</text>
  <text x="40" y="90" font-family="Inter, Arial, sans-serif" font-size="16" fill="#4b5563">Expandable modules form living spaces; terrace benefits from hanger cover</text>
</svg>
