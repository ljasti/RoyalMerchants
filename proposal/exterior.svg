<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <defs>
    <linearGradient id="steelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d1d5db"/>
      <stop offset="1" stop-color="#9ca3af"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3f4f6"/>
      <stop offset="1" stop-color="#e5e7eb"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1200" height="700" fill="#ffffff"/>
  <!-- Ground plane -->
  <rect x="0" y="520" width="1200" height="180" fill="url(#groundGrad)"/>
  <!-- Semi-arched trusses (German hanger style) -->
  <g fill="none" stroke="#6b7280" stroke-width="6">
    <path d="M80,520 C260,200 940,200 1120,520" />
    <path d="M80,520 C260,260 940,260 1120,520" opacity="0.8"/>
    <path d="M80,520 C260,320 940,320 1120,520" opacity="0.6"/>
  </g>
  <!-- Purlins -->
  <g stroke="#9ca3af" stroke-width="3">
    <line x1="180" y1="430" x2="1020" y2="430" />
    <line x1="200" y1="380" x2="1000" y2="380" />
    <line x1="220" y1="340" x2="980" y2="340" />
  </g>
  <!-- Container modules under hanger -->
  <g>
    <rect x="280" y="420" width="300" height="100" fill="#e5e7eb" stroke="#9ca3af"/>
    <rect x="620" y="420" width="300" height="100" fill="#e5e7eb" stroke="#9ca3af"/>
    <rect x="280" y="520" width="640" height="60" fill="#f9fafb" stroke="#d1d5db"/>
    <!-- Doors/windows hints -->
    <rect x="310" y="440" width="40" height="50" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="690" y="440" width="60" height="40" fill="#ffffff" stroke="#cbd5e1"/>
  </g>
  <!-- Human scale -->
  <g transform="translate(980,470)">
    <circle cx="0" cy="-30" r="10" fill="#6b7280"/>
    <rect x="-8" y="-20" width="16" height="50" fill="#6b7280" rx="6"/>
  </g>
  <text x="40" y="60" font-family="Cinzel, Georgia, serif" font-size="28" fill="#111827">Exterior Concept</text>
  <text x="40" y="90" font-family="Inter, Arial, sans-serif" font-size="16" fill="#4b5563">Semi-arched German hanger roof over expandable container modules</text>
</svg>
