<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <rect x="0" y="0" width="1200" height="700" fill="#ffffff"/>
  <!-- Fold/expand mechanism diagrams -->
  <g transform="translate(80,120)">
    <!-- Trailer-compatible module (folded) -->
    <rect x="0" y="0" width="360" height="180" fill="#e5e7eb" stroke="#9ca3af"/>
    <text x="20" y="30" font-family="Inter" font-size="14" fill="#374151">Folded module</text>
    <line x1="180" y1="0" x2="180" y2="180" stroke="#d6483d" stroke-dasharray="6,6"/>
    <text x="190" y="90" font-family="Inter" font-size="12" fill="#374151">hinge axis</text>
    <!-- Expanded state -->
    <rect x="420" y="-20" width="360" height="220" fill="#f9fafb" stroke="#9ca3af"/>
    <rect x="780" y="-20" width="120" height="220" fill="#eef2f7" stroke="#cbd5e1"/>
    <text x="440" y="20" font-family="Inter" font-size="14" fill="#374151">Expanded living area</text>
    <text x="800" y="20" font-family="Inter" font-size="14" fill="#374151">Pop-out wall/roof</text>
    <!-- Tie-down points -->
    <circle cx="20" cy="170" r="6" fill="#d6483d"/>
    <circle cx="340" cy="170" r="6" fill="#d6483d"/>
    <text x="40" y="190" font-family="Inter" font-size="12" fill="#374151">trailer tie-down points</text>
  </g>
  <text x="40" y="60" font-family="Cinzel, Georgia, serif" font-size="28" fill="#111827">Foldable / Expandable Mechanism</text>
  <text x="40" y="90" font-family="Inter, Arial, sans-serif" font-size="16" fill="#4b5563">Side walls hinge out, roof sections lift; quick-connect services enable fast deployment</text>
</svg>
