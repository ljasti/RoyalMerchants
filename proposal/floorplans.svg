<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <rect x="0" y="0" width="1200" height="800" fill="#ffffff"/>
  <!-- 20ft plan -->
  <g transform="translate(60,80)">
    <rect x="0" y="0" width="320" height="180" fill="#f9fafb" stroke="#d1d5db"/>
    <text x="0" y="-10" font-family="Cinzel" font-size="20" fill="#111827">20ft</text>
    <rect x="10" y="10" width="100" height="80" fill="#e5e7eb" stroke="#9ca3af"/>
    <rect x="120" y="10" width="190" height="120" fill="#e5e7eb" stroke="#9ca3af"/>
    <text x="20" y="60" font-family="Inter" font-size="12" fill="#374151">Bed</text>
    <text x="130" y="70" font-family="Inter" font-size="12" fill="#374151">Living/Kitchen</text>
  </g>
  <!-- 30ft plan -->
  <g transform="translate(440,80)">
    <rect x="0" y="0" width="360" height="220" fill="#f9fafb" stroke="#d1d5db"/>
    <text x="0" y="-10" font-family="Cinzel" font-size="20" fill="#111827">30ft</text>
    <rect x="10" y="10" width="120" height="90" fill="#e5e7eb" stroke="#9ca3af"/>
    <rect x="140" y="10" width="210" height="140" fill="#e5e7eb" stroke="#9ca3af"/>
    <rect x="10" y="110" width="120" height="50" fill="#e5e7eb" stroke="#9ca3af"/>
    <text x="20" y="60" font-family="Inter" font-size="12" fill="#374151">Bed</text>
    <text x="150" y="70" font-family="Inter" font-size="12" fill="#374151">Living/Kitchen</text>
    <text x="20" y="140" font-family="Inter" font-size="12" fill="#374151">Bath</text>
  </g>
  <!-- 40ft plan -->
  <g transform="translate(860,80)">
    <rect x="0" y="0" width="320" height="260" fill="#f9fafb" stroke="#d1d5db"/>
    <text x="0" y="-10" font-family="Cinzel" font-size="20" fill="#111827">40ft</text>
    <rect x="10" y="10" width="120" height="100" fill="#e5e7eb" stroke="#9ca3af"/>
    <rect x="140" y="10" width="170" height="160" fill="#e5e7eb" stroke="#9ca3af"/>
    <rect x="10" y="120" width="120" height="60" fill="#e5e7eb" stroke="#9ca3af"/>
    <rect x="10" y="190" width="300" height="60" fill="#eef2f7" stroke="#cbd5e1"/>
    <text x="20" y="60" font-family="Inter" font-size="12" fill="#374151">Bed</text>
    <text x="150" y="90" font-family="Inter" font-size="12" fill="#374151">Living</text>
    <text x="20" y="150" font-family="Inter" font-size="12" fill="#374151">Bath</text>
    <text x="20" y="220" font-family="Inter" font-size="12" fill="#374151">Terrace</text>
  </g>
</svg>
